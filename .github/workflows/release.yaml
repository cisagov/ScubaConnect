# Purpose:  Build, sign and draft release. This workflow is a port of ScubaGear's release workflow
# This workflow's current main purpose is to sign specific PowerShell code for GearConnect
# Then create release assets

name: Build, Sign, and Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. semver, 1.2.4)"
        required: true
        type: string

permissions: read-all

jobs:
  build-and-draft:
    name: Build and Draft Release
    runs-on: windows-latest
    environment: Development
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        shell: powershell
    # This condition prevents duplicate runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          path: repo
      # Code signing is optional so the workflow also works on forks without Azure.
      # Secrets can't be referenced in `if:` conditions, so check them here and expose an output.
      - name: Check Code Signing Configuration
        id: signing
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERTIFICATE_NAME: ${{ secrets.AZURE_CERTIFICATE_NAME }}
        run: |
          $Required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_KEY_VAULT_URL', 'AZURE_CERTIFICATE_NAME')
          $Missing = $Required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($Missing) {
            Write-Output "::warning::Missing secrets: $($Missing -join ', '). Skipping Azure login and code signing; release assets will be unsigned."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Install Azure Signing Tool
        if: steps.signing.outputs.enabled == 'true'
        run: |
          # Source the function
          . repo/utils/workflow/Install-AzureSignTool.ps1
          Install-AzureSignTool
      # OpenID Connect (OIDC) login to Azure Public Cloud with AzPowershell
      - name: Login to Azure
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
      # Hardcoded to sign specifically named scripts in Build-SignRelease.ps1
      # We don't need to sign every script
      - name: Sign Scripts and Bundle Release Asset(s)
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERTIFICATE_NAME: ${{ secrets.AZURE_CERTIFICATE_NAME }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Source the function.
          . repo/utils/workflow/Build-SignRelease.ps1
          if ($env:SIGNING_ENABLED -eq 'true') {
            New-ScubaReleaseAsset `
              -AzureKeyVaultUrl $env:AZURE_KEY_VAULT_URL `
              -CertificateName $env:AZURE_CERTIFICATE_NAME `
              -ReleaseVersion $env:RELEASE_VERSION `
              -RootFolderName "repo"
          }
          else {
            New-ScubaReleaseAsset `
              -SkipSigning `
              -ReleaseVersion $env:RELEASE_VERSION `
              -RootFolderName "repo"
          }
        # Creates release assets
      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        id: create-release
        with:
          draft: true
          prerelease: false
          name: v${{ inputs.version }}
          tag_name: v${{ inputs.version }}
          files: |
            GearConnect-${{ inputs.version }}.zip
            GogglesConnect-${{ inputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true